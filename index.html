<style>
:root{--bg:#F4F1F9;--ink:#26215C;--ink2:#5B5680;--muted:#7C77A0;--line:rgba(38,33,92,.28);--gold:#8A5A0B;--err:#A32D2D;--voice:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16122E;--ink:#EEEAFB;--ink2:#B9B3DA;--muted:#8C86B4;--line:rgba(238,234,251,.3);--gold:#FAC775;--err:#F09595}}
:root[data-theme="dark"]{--bg:#16122E;--ink:#EEEAFB;--ink2:#B9B3DA;--muted:#8C86B4;--line:rgba(238,234,251,.3);--gold:#FAC775;--err:#F09595}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;padding:18px 16px 40px}
.voice{font-family:var(--voice);font-size:20px;line-height:1.55;margin:0 0 10px}
#fan{touch-action:pan-y;user-select:none;-webkit-user-select:none;margin-top:6px}
.row{position:relative}
.c{position:absolute;border-radius:5px;overflow:hidden;cursor:pointer;transform-origin:50% 130%;transition:transform .12s,opacity .3s}
.c svg{display:block;width:100%;height:100%}
.c.g{opacity:.15;pointer-events:none}
.slots{display:flex;justify-content:center;gap:12px;margin-top:6px}
.col{flex:1;max-width:124px;display:flex;flex-direction:column;align-items:center;gap:7px}
.slot{position:relative;width:100%;aspect-ratio:1003/1758;perspective:800px}
.ph{position:absolute;inset:0;border:1px dashed var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.2s ease;cursor:pointer}
.flip.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:rotateY(180deg)}
.front img{display:block;width:100%;height:100%;object-fit:cover}
.lbl{font-size:13px;color:var(--ink2)}
.cap{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 0;min-height:18px}
.err{font-size:13px;color:var(--err);text-align:center;margin:4px 0 0;min-height:18px}
.btns{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}
.ghost{background:none;border:none;color:var(--ink2);font:inherit;font-size:14px;padding:10px 6px;cursor:pointer}
.ghost.p{border:1px solid var(--line);border-radius:8px;padding:10px 18px;color:var(--ink)}
.ghost:focus-visible,.c:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rd{font-family:var(--voice);font-size:20px;line-height:1.6;margin:0 0 18px;opacity:0;transition:opacity 1.6s ease}
.rd.on{opacity:1}
.rd b{display:block;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--gold);margin:0 0 3px}
.note{font-size:12px;color:var(--muted);margin:0}
#lb{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,8,24,.92);align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;border-radius:8px;display:block}
#lb span{font-family:var(--voice);font-size:22px;color:#EEEAFB}
@media (prefers-reduced-motion:reduce){.flip,.rd,.c{transition:none}}
</style>
</head>

var BACK='<svg viewBox="0 0 46 80" preserveAspectRatio="none" aria-hidden="true"><use href="#back"/></svg>';
var order=[],picked=[],locked=false,busy=false,preview=-1,pressed=false,runId=0,revealed=[false,false,false];
var $=function(id){return document.getElementById(id);};
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function shuffle(){order=[0,1,2];for(var i=2;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}}

$('nombre').textContent=CFG.nombre;
$('rol').textContent=CFG.rol;
$('saludo').textContent=CFG.saludo.replace('{fecha}',new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
$('instrucciones').textContent=CFG.instrucciones;
$('ayuda').textContent=CFG.ayudaAbanico;
for(var q=0;q<3;q++)$('l'+q).textContent=CFG.etiquetas[q];
$('reset').textContent=CFG.botones.barajar;
$('go').textContent=CFG.botones.revelar;

var fan=$('fan'),cards=[];
function build(){
var W=fan.clientWidth||380,k=W/380;
var cw=Math.round(W*0.125),ch=Math.round(cw*80/46);
var top=Math.round(24*k),dyMax=Math.round(24*k),rowH=top+ch+dyMax+8;
var step=(W-16-cw)/25;
fan.innerHTML='';cards=[];
for(var r=0;r<3;r++){
var row=document.createElement('div');row.className='row';row.style.height=rowH+'px';
for(var i=0;i<26;i++){
var idx=r*26+i,t=(i-12.5)/12.5;
var c=document.createElement('div');
c.className='c';c.setAttribute('role','button');c.setAttribute('tabindex','0');
c.setAttribute('aria-label','Carta '+(idx+1)+' boca abajo');
c.dataset.n=idx;
c.style.width=cw+'px';c.style.height=ch+'px';c.style.top=top+'px';
c.style.left=(8+i*step)+'px';
c.dataset.dy=Math.round(t*t*dyMax);
c.dataset.rot=(t*15).toFixed(1);
c.innerHTML=BACK;
c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(+this.dataset.n);}});
row.appendChild(c);cards.push(c);
}
fan.appendChild(row);
}
renderFan();
}
function cardAt(e){
var el=document.elementFromPoint(e.clientX,e.clientY);
if(el&&el.closest){var c=el.closest('.c');if(c&&picked.indexOf(+c.dataset.n)===-1)return +c.dataset.n;}
return -1;
}
fan.addEventListener('pointerdown',function(e){if(locked)return;pressed=true;preview=cardAt(e);renderFan();});
fan.addEventListener('pointermove',function(e){
if(locked)return;
if(e.pointerType==='mouse'||pressed){var n=cardAt(e);if(n!==preview){preview=n;renderFan();}}
});
fan.addEventListener('pointerup',function(){
if(locked)return;
pressed=false;var n=preview;preview=-1;
if(n>-1)tap(n);else renderFan();
});
fan.addEventListener('pointercancel',function(){pressed=false;preview=-1;renderFan();});
fan.addEventListener('pointerleave',function(){if(!pressed&&preview>-1){preview=-1;renderFan();}});
function tap(n){
if(locked)return;
$('err').textContent='';
if(picked.indexOf(n)>-1)return;
if(picked.length<3){picked.push(n);}
else{$('err').textContent=CFG.errores.sobran;}
render();
}
function renderFan(){
cards.forEach(function(c,n){
var g=picked.indexOf(n)>-1;
var lift=(n===preview&&!g)?Math.round(c.offsetHeight*0.16):0;
c.style.transform='translateY('+(+c.dataset.dy-lift)+'px) rotate('+c.dataset.rot+'deg)';
c.style.zIndex=n===preview?50:1;
if(g)c.classList.add('g');else c.classList.remove('g');
});
}
function openLb(k){
var cd=CARDS[order[k]];
$('lbimg').src=cd.src;$('lbimg').alt=cd.es;$('lbname').textContent=CFG.etiquetas[k]+' · '+cd.es;
$('lb').classList.add('on');
}
$('lb').addEventListener('click',function(){this.classList.remove('on');});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('lb').classList.remove('on');});
function renderSlots(){
for(var k=0;k<3;k++){
var s=$('s'+k);
s.innerHTML='';
if(picked[k]!==undefined){
var cd=CARDS[order[k]];
var f=document.createElement('div');f.className='flip';f.id='fl'+k;
f.innerHTML='<div class="face">'+BACK+'</div><div class="face front"><img src="'+cd.src+'" alt="'+cd.es+'" draggable="false"></div>';
if(revealed[k])f.classList.add('f');
(function(kk){f.addEventListener('click',function(){
if(!locked){picked.splice(kk,1);$('err').textContent='';render();}
else if(revealed[kk]){openLb(kk);}
});})(k);
s.appendChild(f);
}else{
var p=document.createElement('div');p.className='ph';p.textContent='+';
s.appendChild(p);
}
}
}
function render(){renderFan();renderSlots();}
async function reveal(){
if(locked||busy)return;
if(picked.length<3){$('err').textContent=CFG.errores.faltan;return;}
locked=true;busy=true;
var my=++runId;
$('err').textContent='';
$('go').style.display='none';
var cap=$('cap'),rd=$('reading');
rd.innerHTML='';
cap.textContent=CFG.ceremonia.inicio;
await wait(1400);
for(var k=0;k<3;k++){
if(my!==runId)return;
cap.textContent=CFG.ceremonia.aperturas[k];
await wait(900);
$('fl'+k).classList.add('f');revealed[k]=true;
await wait(2200);
}
cap.textContent=CFG.ceremonia.antesLectura;
await wait(1800);
var paras=[];
for(var j=0;j<3;j++){
var cd=CARDS[order[j]];
paras.push('<b>'+CFG.etiquetas[j]+' · '+cd.es+'</b>'+CFG.lectura[j].replace('{tema}',cd.tema));
}
paras.push(CFG.cierre);
for(var i=0;i<paras.length;i++){
if(my!==runId)return;
var p=document.createElement('p');
p.className='rd';
p.innerHTML=paras[i];
rd.appendChild(p);
void p.offsetWidth;
p.classList.add('on');
await wait(i<3?3800:2000);
}
if(my!==runId)return;
var n2=document.createElement('p');n2.className='note';n2.textContent=CFG.nota;
rd.appendChild(n2);
cap.textContent='';
busy=false;
}
$('go').addEventListener('click',reveal);
$('reset').addEventListener('click',function(){
if(busy)return;
runId++;
picked=[];locked=false;preview=-1;revealed=[false,false,false];shuffle();
$('err').textContent='';$('cap').textContent='';$('reading').innerHTML='';
$('go').style.display='';
render();
});
var rt;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(build,150);});
shuffle();build();renderSlots();
</script>
